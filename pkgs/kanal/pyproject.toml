[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name    = "kanal"
version = "0.6.1"
description = "notenix update-channel switcher — GUI and CLI"
requires-python = ">=3.11"
dependencies    = ["packaging"]

[project.scripts]
kanal    = "kanal.__main__:main"
kanalctl = "kanal.__main__:main_ctl"

[tool.setuptools]
package-dir = {"" = "src"}
packages    = ["kanal", "kanal.gui"]

[tool.setuptools.package-data]
kanal = ["*.yaml", "icons/hicolor/scalable/actions/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.commitizen]
name                     = "cz_customize"
version_provider         = "pep621"    # reads/writes [project].version
tag_format               = "v$version"
update_changelog_on_bump = true
major_version_zero       = true        # 0.x.y: breaking changes bump minor not major
changelog_file           = "../../CHANGELOG.md"
version_files            = ["flake.nix"]

[tool.commitizen.customize]
bump_pattern = "^(feat|fix|refactor|perf|chore|build)(\\(.+\\))?(!)?:"

[tool.commitizen.customize.bump_map]
"^feat"     = "MINOR"
"^fix"      = "PATCH"
"^refactor" = "PATCH"
"^perf"     = "PATCH"
"^chore"    = "PATCH"
"^build"    = "PATCH"
"^feat!|^fix!|^refactor!|BREAKING CHANGE" = "MAJOR"

[tool.commitizen.customize.bump_map_major_version_zero]
"^feat"     = "MINOR"
"^fix"      = "PATCH"
"^refactor" = "PATCH"
"^perf"     = "PATCH"
"^chore"    = "PATCH"
"^build"    = "PATCH"
"^feat!|^fix!|^refactor!|BREAKING CHANGE" = "MINOR"
